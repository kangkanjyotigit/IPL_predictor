{% extends 'base.html' %}

{% block title %}Forbidden{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-body text-center p-5">
                    <h1 class="display-1 text-danger">403</h1>
                    <h2 class="mb-4">Forbidden</h2>
                    <p class="lead mb-4">{{ error_message|default('You do not have permission to access this resource.') }}</p>
                    <a href="{{ url_for('frontend.index') }}" class="btn btn-primary">
                        <i class="bi bi-house-door"></i> Go to Home
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
