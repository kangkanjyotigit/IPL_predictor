{% extends 'base.html' %}

{% block title %}Error {{ error_code }} - Dream11 Prediction{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center"> 
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-danger text-white">
                    <h3 class="mb-0">Error {{ error_code }}</h3>
                </div>
                <div class="card-body text-center py-5">
                    <h1 class="display-1 text-danger mb-4">{{ error_code }}</h1>
                    <p class="lead mb-4">{{ error_message }}</p>
                    <a href="{{ url_for('frontend.index') }}" class="btn btn-primary">Return to Home</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
