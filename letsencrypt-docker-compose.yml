version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    depends_on:
      - web

  certbot:
    image: certbot/certbot
    entrypoint: |
      sh -c 'trap exit TERM; while :; do
        certbot renew \
          --non-interactive \
          --agree-tos \
          --email admin@dreamkaro.com \
          --webroot-path /var/www/certbot
        sleep 12h
      done;'
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
